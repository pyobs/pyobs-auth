[project]
name = "pyobs-auth"
version = "2.0.0.dev1"
description = "Shared Keycloak/OIDC authentication client for pyobs web services"
authors = [{ name = "Tim-Oliver Husser", email = "thusser@uni-goettingen.de" }]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "Django>=5.2,<6",
    "djangorestframework>=3.15",
    "requests>=2.32.3,<3",
    "PyJWT[crypto]>=2.10.1,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<10",
    "pytest-django>=4.9.0,<5",
    "pytest-cov>=6.1.1,<8",
    "black>=25.1.0,<27",
    "ruff>=0.15.16",
    "pyrefly>=1.1.1",
    "responses>=0.25.0,<1",
    "types-requests>=2.32.0.20250328,<3",
]

[tool.hatch.build.targets.sdist]
include = ["pyobs_auth"]

[tool.hatch.build.targets.wheel]
include = ["pyobs_auth"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.setuptools.package-data]
"pyobs_auth" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "G"]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
addopts = "-ra"
